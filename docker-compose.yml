services:
  # Build for arm64 architecture
  arm64_builder_12:
    image: arm64v8/gcc:latest
    container_name: arm64_builder
    platform: linux/arm64
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "12"]

  arm64_builder_13:
    image: arm64v8/gcc:latest
    container_name: arm64_builder
    platform: linux/arm64
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "13"]

  arm64_builder_14:
    image: arm64v8/gcc:latest
    container_name: arm64_builder
    platform: linux/arm64
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "14"]

  # Build for x86_64 architecture
  x86_64_builder_12:
    image: gcc:latest
    container_name: x86_64_builder
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "12"]

  x86_64_builder_13:
    image: gcc:latest
    container_name: x86_64_builder
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "13"]

  x86_64_builder_14:
    image: gcc:latest
    container_name: x86_64_builder
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "install_compile.sh", "14"]
