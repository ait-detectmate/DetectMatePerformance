name: Python application

on:
  push:
    branches: [ "main", "development"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set timezone
        run: sudo timedatectl set-timezone Europe/Vienna

      - name: Add priviledge
        run:  docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Run Docker Compose and wait for all containers
        shell: bash
        run: |
          set -euo pipefail
          services=$(docker compose config --services)
          test -n "$services"
          status=0

          # Keep track of startup failures, but still wait for containers
          # that did start. Do not abort when the first container exits.
          docker compose up --detach || status=1

          for service in $services; do
            if ! containers=$(docker compose ps --all --quiet "$service"); then
              echo "::error::Could not inspect service $service"
              status=1
              continue
            fi
            if [[ -z "$containers" ]]; then
              echo "::error::No container was created for $service"
              status=1
              continue
            fi

            for container in $containers; do
              if ! state=$(docker inspect --format '{{.State.Status}}' "$container"); then
                echo "::error::Could not inspect container $container"
                status=1
                continue
              fi
              # A created container blocked by a failed dependency never ran;
              # waiting on it would hang forever.
              case "$state" in
                running|restarting|exited)
                  if code=$(docker wait "$container"); then
                    echo "$service ($container) exited with code $code"
                    if [[ "$code" != 0 ]]; then
                      echo "::error::$service failed with exit code $code"
