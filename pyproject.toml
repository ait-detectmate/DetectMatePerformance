[project]
name = "detectmateperformance"
description = "A Python package for DetectMate performance evaluation."
requires-python = ">=3.12"
license = "EUPL-1.2"
version="0.1.6"
dependencies = [
    "levenshtein>=0.27.3",
    "numpy>=2.4.4",
    "polars>=1.38.1",
    "pybind11>=3.0.4",
    "setuptools>=82.0.1",
    "tqdm",
]

[dependency-groups]
# add dependencies in this section with: uv add --optional dev <package>
# install with all the dev dependencies:  uv pip install -e .[dev]
dev = [
    "mike>=2.1.3",
    "prek>=0.2.8",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-cpp",
]

[project.urls]
Homepage = "https://ait-detectmate.github.io/DetectMatePerformance/latest"
Repository = "https://github.com/ait-detectmate/DetectMatePerformance"

[build-system]
requires = ["setuptools>=82.0.1", "wheel", "cmake"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.md"]

[tool.setuptools.package-data]
"*" = [
    "lib/bind_class.*",
    "_templates/*.txt"
]
